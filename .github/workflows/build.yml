name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Create temporary CI signing key
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/ironlog-ci-debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Build debug app and run unit tests
        run: bash ./gradlew --no-daemon -PironlogDebugKeystore="$RUNNER_TEMP/ironlog-ci-debug.keystore" testDebugUnitTest assembleDebug

  legacy-relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test optional PC relay
        working-directory: coach-relay
        run: npm test
